server.port=8005

# Rotas: o gateway recebe tudo na porta 8005 e repassa
spring.cloud.gateway.server.webflux.routes[0].id=USUARIO-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USUARIO-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/usuario/**

spring.cloud.gateway.server.webflux.routes[1].id=LIVRO-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://LIVRO-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/livro/**

spring.cloud.gateway.server.webflux.routes[2].id=EMPRESTIMO-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://EMPRESTIMO-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/emprestimo/**
